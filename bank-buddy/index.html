<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Bank Buddy is a practice banking app from Hug Your Head Foundation.">
<link rel="manifest" href="/bank-buddy/manifest.webmanifest">
<link rel="apple-touch-icon" href="/bank-buddy/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/bank-buddy/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Bank Buddy Guided</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, navy header, white rows on a pale grey ground, tab bar at the bottom. */
:root{
  --navy:#0b2a4a; --acc:#0a6ebd; --bg:#f2f4f7; --line:#e1e6ec; --mute:#5b6b7a; --txt:#1b2733; --pos:#17703f; --err:#b3261e; --gold:#e8a317;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#dfe5ec;color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
#app{height:100%;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(11,42,74,.18)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hdr{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 14px;flex:none}
.hdr.big{padding:calc(env(safe-area-inset-top) + 18px) 20px 20px}
.nav{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;min-height:44px}
.nav .t{font-size:18px;font-weight:700;text-align:center}
.nav .r{display:flex;justify-content:flex-end}
.nbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:#fff;font-weight:600;font-size:17px;background:none;border:none}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;background:none;border:none;color:var(--mute);font-size:12px;font-weight:600;padding:0}
.tab[aria-current="page"]{color:var(--acc);font-weight:700}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 8px}
.sect h2{margin:0;font-size:14px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.sect span{font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;background:#fff;border:none;border-bottom:1px solid var(--line);width:100%;text-align:left;text-decoration:none;color:var(--txt)}
.row .m{flex:1;min-width:0}
.row .n{font-size:17px;font-weight:600}
.row .s{font-size:14px;color:var(--mute);margin-top:2px;line-height:1.3}
.row .a{text-align:right}
.row .amt{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.chev{color:#8a97a5;flex:none}
.qa{display:flex;background:#fff;padding:16px 8px 14px;border-bottom:1px solid var(--line)}
.qa button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px;background:none;border:none;font-size:13px;font-weight:600}
.qa .c{width:52px;height:52px;border-radius:26px;background:#e6f0fa;color:var(--acc);display:flex;align-items:center;justify-content:center}
.promo{margin:16px;background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);width:calc(100% - 32px);text-align:left}
.tx{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;background:#fff;border:none;border-bottom:1px solid var(--line);width:100%;text-align:left}
.av{flex:none;width:40px;height:40px;border-radius:20px;background:#e6edf5;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tx .m{flex:1;min-width:0}
.tx .n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:14px;color:var(--mute)}
.tx .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}
.lbl{padding:12px 16px 6px;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.seg{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.seg button{flex:1;padding:12px 0;font-size:16px;font-weight:600;color:var(--mute);background:none;border:none;border-bottom:3px solid transparent;min-height:48px}
.seg button[aria-selected="true"]{color:var(--acc);font-weight:700;border-bottom-color:var(--acc)}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:15px;border:none}
.search{display:flex;gap:8px;padding:10px 16px}
.search .f{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #c9d2dc;border-radius:22px;padding:0 14px;min-height:44px;color:var(--mute)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:16px;min-width:0;min-height:42px}
.search .fb{width:44px;height:44px;border-radius:22px;border:1px solid #c9d2dc;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;padding:0 16px 10px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid #c9d2dc;background:#fff;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.fld{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.fld .fm{flex:1;min-width:0}
.fld .lab{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.fld .val{font-size:17px;font-weight:600;margin-top:2px}
.fld .sub{font-size:14px;color:var(--mute)}
.fld select{width:100%;border:none;background:transparent;font-size:17px;font-weight:600;padding:2px 28px 2px 0;appearance:none;-webkit-appearance:none;outline-offset:6px;margin-top:2px}
.fld .dd{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#8a97a5}
.fld input.txt{width:100%;border:none;outline:none;background:transparent;font-size:17px;font-weight:500;padding:2px 0;min-height:28px;margin-top:2px}
.amt-box{background:#fff;padding:14px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.amt-box .in{display:flex;align-items:center;gap:4px}
.amt-box .in span{font-size:34px;font-weight:700;color:var(--mute)}
.amt-box input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:34px;font-weight:700;min-height:48px;font-variant-numeric:tabular-nums}
.err{display:flex;gap:8px;align-items:flex-start;margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:#fdecea;color:var(--err);font-size:15px;font-weight:600;line-height:1.35}
.note{padding:12px 16px;font-size:13px;color:var(--mute);line-height:1.45}
.foot{padding:12px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:28px;border:2px solid var(--acc);background:var(--acc);color:#fff;font-weight:700;font-size:18px;width:100%}
.btn.s{background:#fff;color:var(--acc)}
.btn.sm{min-height:48px;font-size:16px}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.kv .k{font-size:15px;color:var(--mute);font-weight:500}
.kv .v{font-size:16px;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.hero{background:#fff;padding:22px 16px 18px;text-align:center;border-bottom:1px solid var(--line)}
.hero .k{font-size:14px;font-weight:600;color:var(--mute)}
.hero .b{font-size:44px;font-weight:800;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.ok{width:72px;height:72px;border-radius:36px;background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.login-top{background:var(--navy);padding:calc(env(safe-area-inset-top) + 56px) 24px 84px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff}
.login-card{margin:-52px 20px 0;background:#fff;border-radius:16px;padding:20px 18px 18px;box-shadow:0 6px 20px rgba(11,42,74,.18);display:flex;flex-direction:column;gap:14px}
.login-card label.l{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:4px}
.dots{-webkit-text-security:disc;text-security:disc}
.login-card input[type=text],.login-card input[type=password]{width:100%;border:1.5px solid #9aa8b6;border-radius:10px;padding:10px 12px;font-size:18px;min-height:48px;background:#fff}
.pw{display:flex;align-items:center;border:1.5px solid #9aa8b6;border-radius:10px;padding-right:6px}
.pw input{border:none!important;flex:1;min-width:0}
.linkbtn{background:none;border:none;color:var(--acc);font-weight:600;font-size:16px;min-height:44px;padding:0 8px}
.contact{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:62px;background:#fff;border:none;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rec{display:flex;gap:6px;padding:4px 10px 16px;overflow-x:auto}
.rec button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;min-height:44px;background:none;border:none;font-size:13px;font-weight:600}
.rec .av{width:56px;height:56px;border-radius:28px;background:#dbe8f6;font-size:19px}
.card3d{margin:16px;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0b2a4a,#0a6ebd);min-height:170px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(11,42,74,.25)}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:#9aa8b6;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .15s}
.sw input:checked + i{background:var(--acc)}
.sw input:checked + i::after{transform:translateX(20px)}
.sw input:focus-visible + i{outline:3px solid #ffbf47;outline-offset:2px}
.scrim{position:absolute;inset:0;background:rgba(11,42,74,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 16px);max-height:85%;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#c9d2dc;margin:4px auto 10px}
.sheet h2{margin:0;padding:4px 16px 8px;font-size:20px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;z-index:30;text-align:center}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--txt);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.up{width:100%;display:flex;gap:10px;padding:12px 16px;background:#fff}
.up label{flex:1;position:relative;min-height:96px;border:2px dashed #9aa8b6;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--mute);text-align:center;padding:8px;cursor:pointer}
.up label.done{border-style:solid;border-color:var(--pos);color:var(--pos)}
.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.hdr{position:relative}
.login-top{position:relative}
.tipsbtn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:22px;border:none;background:#ffbf47;color:#3b2a00;font-weight:800;font-size:15px;z-index:5}
.tipsbtn.s1{right:76px}.tipsbtn.s2{right:60px}
.tourblock{position:absolute;inset:0;z-index:40;background:transparent}
.tourblock.dim{background:rgba(11,42,74,.68)}
.ring{position:absolute;z-index:41;border:3px solid #ffbf47;border-radius:14px;box-shadow:0 0 0 9999px rgba(11,42,74,.68);pointer-events:none}
.ring.pulse{box-shadow:none;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,191,71,.8)}50%{box-shadow:0 0 0 10px rgba(255,191,71,0)}}
.tpop{position:absolute;z-index:43;left:16px;width:calc(100% - 32px);max-width:330px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tpop.say{left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 40px);max-width:340px;padding:22px 20px 16px;text-align:center}
.tpop h3{margin:8px 0 6px;font-size:22px;line-height:1.2}
.tpop p{margin:0;font-size:17px;line-height:1.45;font-weight:500}
.tpop.say p{font-size:19px}
.tpop .tb{display:flex;align-items:center;gap:8px;margin-top:12px}
.tpop .cnt{flex:1;font-size:13px;color:var(--mute);font-weight:600;text-align:left}
.tbtn{min-height:46px;padding:0 20px;border-radius:23px;border:2px solid var(--acc);background:var(--acc);color:#fff;font-weight:700;font-size:17px}
.tbtn.o{background:#fff;color:var(--acc)}
.tbtn.ic{width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.skip{background:none;border:none;color:var(--mute);font-size:14px;font-weight:600;min-height:44px;padding:0 6px;text-decoration:underline}
.trybar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:35;background:#fff8e1;border:2px solid #ffbf47;border-radius:14px;padding:6px 6px 6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.trybar .tbtn.ic{min-height:40px;min-width:40px}
.trybar .mini{flex:none;border:none;background:rgba(0,0,0,.08);border-radius:999px;font-size:14px;font-weight:700;padding:0 12px;min-height:40px;color:inherit}
.trybar.min{left:auto;right:10px;padding:4px 12px 4px 6px;border-radius:999px;cursor:pointer}
.trybar.min .t,.trybar.min .tbtn,.trybar.min .skip,.trybar.min .mini{display:none}
.trybar.min:after{content:'Your turn';font-size:14px;font-weight:700;color:#3b2a00}
.trybar.mbar.min:after{content:'Mission';color:var(--navy)}
.trybar.cbar.min:after{content:'Challenge'}
.trybar .t{flex:1;font-size:15px;font-weight:700;line-height:1.25;color:#3b2a00}
.trybar.mbar{background:#e6f0fa;border-color:var(--acc)}
.trybar.mbar .t{color:var(--navy)}
.mcard{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;border-radius:16px;border:2px solid #ffbf47;background:#fff8e1;text-align:left}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-rank{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:800;color:#3b2a00}
.mc-n{font-size:14px;font-weight:700;color:#3b2a00}
.bar{display:block;height:12px;border-radius:6px;background:#f0e2b6;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.mc-cta{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;color:var(--acc)}
.rankcard{background:#fff;padding:18px 16px;border-bottom:1px solid var(--line)}
.lv{display:flex;gap:6px;margin-top:12px}
.lv span{flex:1;text-align:center;font-size:13px;font-weight:700;padding:8px 2px;border-radius:10px;border:2px solid var(--line);color:var(--mute)}
.lv span.on{border-color:var(--navy);background:var(--navy);color:#fff}
.lv span.past{border-color:var(--pos);color:var(--pos)}
.chip2{flex:none;min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:18px;font-size:14px;font-weight:700;border:2px solid var(--acc);color:var(--acc);background:#fff}
.chip2.dn{border-color:var(--pos);color:var(--pos)}
.stars{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.chk{background:#fff;padding:6px 16px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chk label{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:10px 0;font-size:16px;font-weight:600;line-height:1.35;border-bottom:1px solid var(--line)}
.chk label:last-child{border-bottom:none}
.chk input{width:26px;height:26px;accent-color:var(--acc);flex:none;margin:0}
.btn[disabled]{opacity:.45}
.qcard{margin:16px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px}
.qcard .src{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.qcard .msg{font-size:20px;font-weight:600;line-height:1.4;margin-top:6px}
.res{margin:0 16px;padding:14px;border-radius:14px;border:2px solid;font-size:16px;line-height:1.45}
.res.good{border-color:var(--pos);background:#eaf6ee}.res.bad{border-color:var(--err);background:#fdecea}
.res b{display:flex;align-items:center;gap:8px;font-size:19px;margin-bottom:4px}
.login-card{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n)};
var r2=function(n){return Math.round(n*100)/100};

var dlong=function(iso){return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
function ico(p,s,fill){s=s||24;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+(fill||'none')+'" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var P={
 accounts:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',
 transfer:'<path d="M4 8h14M14 4l4 4-4 4"/><path d="M20 16H6M10 12l-4 4 4 4"/>',

 cards:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 bell:'<path d="M6 16v-5a6 6 0 1112 0v5l2 2H4l2-2z"/><path d="M10 21h4"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',back:'<path d="M15 5l-7 7 7 7"/>',down:'<path d="M5 9l7 7 7-7"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

function startFlow(f){UI.flow=f;go({name:'form'})}
function validate(){
  var f=UI.flow, amt=parseAmt(f.amount), from=A(f.from);
  if(isNaN(amt)||amt<=0)return 'Enter an amount greater than $0.00, like 25.00.';
  if(amt>from.bal)return 'Not enough money in '+from.name+'. It has '+fmt(from.bal)+' available.';
  if(f.kind==='transfer'&&A(f.to).kind==='Credit card'&&amt>A(f.to).bal)return 'That is more than the card balance of '+fmt(A(f.to).bal)+'.';
  if(f.kind==='send'&&amt>SEND_LIMIT)return 'The most you can send in one day is '+fmt(SEND_LIMIT)+'.';
  f.amt=amt;return '';
}
function submit(){
  var f=UI.flow, amt=f.amt, from=A(f.from), code=conf(), res;
  from.bal=r2(from.bal-amt);
  if(f.kind==='transfer'){
    var to=A(f.to), cc=to.kind==='Credit card';
    if(cc){to.bal=r2(to.bal-amt);addTx(to.id,'Payment, thank you','Payment',amt);addTx(from.id,'Payment to '+to.name,'Transfer',-amt)}
    else{to.bal=r2(to.bal+amt);addTx(from.id,'Transfer to '+to.name,'Transfer',-amt);addTx(to.id,'Transfer from '+from.name,'Transfer',amt)}
    res={head:cc?'Payment submitted':'Transfer submitted',line:fmt(amt)+' is on its way to '+to.name+'.'+(f.freq!=='One time'?' It repeats '+f.freq.toLowerCase()+'.':''),rows:[['From',esc(from.name)+' ...'+from.mask],['To',esc(to.name)+' ...'+to.mask],['Amount',fmt(amt)],['Date',dlong(new Date().toISOString())]],code:code,again:'newtransfer',againLabel:'Make another transfer'};
  } else if(f.kind==='send'){
    var c=CONTACTS.filter(function(x){return x.id===f.contact})[0];
    addTx(from.id,'Sent to '+c.name,'Sent money',-amt);
    res={head:'Money sent',line:fmt(amt)+' is on its way to '+c.name+'.',rows:[['Sent to',esc(c.name)],['From',esc(from.name)+' ...'+from.mask],['Amount',fmt(amt)],['Date',dlong(new Date().toISOString())]],code:code,again:'sendpick',againLabel:'Send to someone else'};
  } else {
    var p=PAYEES.filter(function(x){return x.id===f.payee})[0];
    addTx(from.id,'Bill pay: '+p.name,'Bills',-amt);
    res={head:'Payment submitted',line:fmt(amt)+' is on its way to '+p.name+'.',rows:[['Paid to',esc(p.name)],['From',esc(from.name)+' ...'+from.mask],['Amount',fmt(amt)],['Date',dlong(new Date().toISOString())]],code:code,again:'bills',againLabel:'Pay another bill'};
  }
  save();
  complete(f.kind==='transfer'?'transfer':f.kind==='send'?'send':'bill');
  if(UI.chal&&UI.chal.id==='dinner'&&f.kind==='send')finishDinner();
  UI.hist=[{name:'accounts'}]; UI.view={name:'confirm',r:res}; UI.flow=null; render(true);
}

var VOICE=null;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[]; if(!vs.length)return null;
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU|CA|IE|ZA|IN)?/i.test(v.lang)||/^en$/i.test(v.lang)});
    if(!en.length)return null;
    var bad=/compact|fred|albert|bahh|bells|boing|bubbles|cellos|deranged|good news|bad news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|zarvox|superstar|espeak/i;
    function score(v){
      var n=v.name,sc=0;
      if(bad.test(n))return -100;
      if(/natural|neural|online/i.test(n))sc+=60;
      if(/premium|enhanced|siri/i.test(n))sc+=50;
      if(/^(ava|zoe|samantha|allison|susan|nicky|evan|nathan|serena|karen|moira|aria|jenny|sonia|libby|google us english|google uk english female)/i.test(n))sc+=30;
      if(/en[-_]US/i.test(v.lang))sc+=10;
      if(!v.localService)sc+=5;
      return sc;
    }
    en.sort(function(x,y){return score(y)-score(x)});
    return en[0];
  }catch(e){return null}
}

function speak(text,quiet){
  try{
    if(!('speechSynthesis' in window)){if(!quiet)toast('Reading out loud is not available on this phone.');return}
    var ss=window.speechSynthesis; ss.cancel();
    if(!VOICE)VOICE=pickVoice();
    var parts=String(text).replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[String(text)];
    parts.forEach(function(t){
      t=t.trim(); if(!t)return;
      var u=new SpeechSynthesisUtterance(t);

  var d=S.ch.dinner||(S.ch.dinner={tries:1}), m=UI.chal.mistakes;
  d.done=true;d.last=m;d.best=(d.best===undefined)?m:Math.min(d.best,m);d.at=new Date().toISOString();
  logEv('dinner','Dinner Challenge done with '+m+' mistakes');save();
  UI.chalDone={mistakes:m};UI.chal=null;
}
ACT.chhub=function(){go({name:'chhub'})};
ACT.progress=function(){go({name:'progress'})};
ACT.chintro=function(){go({name:'chintro'})};
ACT.chstart=function(){
  var d=S.ch.dinner||(S.ch.dinner={tries:0});d.tries++;save();
  UI.chal={id:'dinner',mistakes:0};UI.mission=null;UI.cmsg='';UI.flow=null;root('accounts');
};
ACT.chstop=function(){UI.chal=null;UI.cmsg='';render()};
ACT.chalok=function(){UI.chalDone=null;render()};
ACT.hintclose=function(){UI.hint=null;render()};
ACT.sctstart=function(){
  UI.sct={i:0,pick:null,score:0,stage:'q',ord:SCEN.map(function(s){return shuf(s.opts.length)})};
  if(UI.view.name==='sctest'){render(true)}else go({name:'sctest'});
};
ACT.scpick=function(d){
  var t=UI.sct,q=SCEN[t.i];if(t.pick!==null)return;
  t.pick=+d.o;var right=q.opts[t.pick][1]===1;
  S.sc.t++;if(right){S.sc.r++;t.score++}save();render();
};
ACT.scnext=function(){
  var t=UI.sct;
  if(t.i>=SCEN.length-1){
    t.stage='done';var s=S.ch.scam||(S.ch.scam={tries:0,bestScore:0});
    s.tries++;s.done=true;s.last=t.score;s.bestScore=Math.max(s.bestScore,t.score);if(t.score>=SCEN.length-1)s.passed=true;s.at=new Date().toISOString();
    logEv('scamtest','Scam Test '+t.score+' of '+SCEN.length);save();
  } else {t.i++;t.pick=null}
  render(true);
};
ACT.sharesheet=function(){UI.nick=S.nick||'';UI.sheet={type:'share'};render()};
ACT.repcopy=function(){
  var txt=reportText();
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Copied. You can paste it in a message.')},function(){toast('Could not copy. Press and hold the text to copy it.')});return}
  }catch(e){}
  var ta=document.getElementById('reptext');if(ta){ta.select();try{document.execCommand('copy');toast('Copied. You can paste it in a message.')}catch(e){toast('Press and hold the text to copy it.')}}
};
ACT.repshare=function(){try{navigator.share({title:'Bank Buddy results',text:reportText()})}catch(e){}};

ensure();
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t)return;
  if(t.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  if(t.type==='checkbox'&&e.type==='click'){/* handled by change */return}
  var fn=ACT[t.dataset.a]; if(fn){fn(t.dataset,e)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('input[type=checkbox][data-a]')){var fn=ACT[t.dataset.a];if(fn)fn(t.dataset,e);return}
  if(t.dataset.safety!==undefined){UI.safety[+t.dataset.safety]=t.checked;render();return}
  if(t.dataset.sel){var p=t.dataset.sel.split('.');UI[p[0]][p[1]]=t.value;UI.err='';render()}
  if(t.dataset.file){UI.dep[t.dataset.file]=t.files&&t.files[0]?t.files[0].name:'';render()}
});
document.addEventListener('input',function(e){
  var t=e.target; if(!t.dataset.in)return;
  var p=t.dataset.in.split('.');
  if(p.length===2){UI[p[0]][p[1]]=t.value}
  else{UI[p[0]]=t.value;
    if(p[0]==='nick'){S.nick=UI.nick.slice(0,30);save();var rt=document.getElementById('reptext'),mb=document.getElementById('mailbtn');if(rt)rt.value=reportText();if(mb)mb.href='mailto:'+REPORT_EMAIL+'?subject='+encodeURIComponent('Bank Buddy results'+(S.nick?' - '+S.nick:''))+'&body='+encodeURIComponent(reportText())}
    if(p[0]==='q'){var a=A(UI.view.id);document.getElementById('txlist').innerHTML=listFor(a)}
    if(p[0]==='cq'){var q=UI.cq.trim().toLowerCase();document.getElementById('clist').innerHTML=contactList(CONTACTS.filter(function(c){return !q||(c.name+' '+c.sub).toLowerCase().indexOf(q)>-1}))}
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='loginform'){
    e.preventDefault();
    var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
    if(!u||!p){UI.err='Enter your username and password.';render();return}
    S.user=u.slice(0,30);save();complete('signin');root('accounts');
  }
});
window.addEventListener('resize',function(){if(UI.tour)placeTour();fixBars()});
function outsideBar(e){if(e.target&&e.target.closest&&!e.target.closest('.trybar'))minBar()}
document.addEventListener('pointerdown',outsideBar);
document.addEventListener('focusin',outsideBar);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&UI.sheet){UI.sheet=null;render()}});
render();
</script>
</body>
</html>
